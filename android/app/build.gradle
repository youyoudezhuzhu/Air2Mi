plugins { id 'com.android.application' }

android {
    namespace 'org.air2mi.app'
    buildFeatures { buildConfig true }
    compileSdk 35
    defaultConfig {
        applicationId 'org.air2mi.app'
        minSdk 29
        targetSdk 34
        versionCode 11003
        versionName '1.1.2'
        resValue 'string', 'app_name', 'Air2Mi'
        buildConfigField 'boolean', 'BUNDLED_TEST_ENGINE', 'false'
        buildConfigField 'String', 'BUNDLED_TEST_ENGINE_SHA256', '""'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets { main { assets.srcDirs += ['../../web/dist'] } }
    packaging { jniLibs { useLegacyPackaging = true } }
    buildTypes {
        bundledRelease {
            initWith debug
            debuggable false
            signingConfig signingConfigs.debug
            buildConfigField 'boolean', 'BUNDLED_TEST_ENGINE', 'true'
            buildConfigField 'String', 'BUNDLED_TEST_ENGINE_SHA256', '"' + providers.gradleProperty('bundledEngineSha256').getOrElse('') + '"'
            matchingFallbacks = ['debug']
        }
        bundledTest {
            initWith debug
            debuggable false
            signingConfig signingConfigs.debug
            applicationIdSuffix '.bundledtest'
            versionNameSuffix '-bundled-beta10'
            resValue 'string', 'app_name', 'Air2Mi 测试版'
            buildConfigField 'boolean', 'BUNDLED_TEST_ENGINE', 'true'
            buildConfigField 'String', 'BUNDLED_TEST_ENGINE_SHA256', '"' + providers.gradleProperty('bundledEngineSha256').getOrElse('') + '"'
            matchingFallbacks = ['debug']
        }
    }
    testBuildType providers.gradleProperty('bundledTestInstrumentation').isPresent() ? 'bundledTest' : 'debug'
    sourceSets { bundledTest { assets.srcDir layout.buildDirectory.dir('generated/bundledTestAssets') }; bundledRelease { assets.srcDir layout.buildDirectory.dir('generated/bundledTestAssets') } }
}

tasks.register('stageBundledTestEngine') {
    def input = providers.gradleProperty('bundledEnginePackage')
    def expected = providers.gradleProperty('bundledEngineSha256')
    inputs.property('enginePath', input.getOrElse(''))
    inputs.property('engineSha256', expected.getOrElse(''))
    if (input.isPresent()) inputs.file(input.get())
    outputs.dir layout.buildDirectory.dir('generated/bundledTestAssets')
    doLast {
        if (!input.isPresent() || !expected.getOrElse('').matches('[0-9a-f]{64}'))
            throw new GradleException('Local bundled test requires an external Engine ZIP and its pinned SHA256')
        def source = file(input.get())
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        source.withInputStream { stream -> byte[] block = new byte[65536]; int n; while ((n = stream.read(block)) != -1) digest.update(block, 0, n) }
        if (digest.digest().encodeHex().toString() != expected.get()) throw new GradleException('Engine ZIP SHA256 mismatch')
        def destination = layout.buildDirectory.dir('generated/bundledTestAssets/private').get().asFile
        destination.mkdirs()
        copy { from source; into destination; rename { 'air2mi-engine-components.zip' } }
    }
}
tasks.configureEach { task ->
    if (task.name != 'stageBundledTestEngine' && (task.name.contains('BundledTest') || task.name.contains('BundledRelease')))
        task.dependsOn('stageBundledTestEngine')
}

dependencies { implementation files('../libs/air2mi-python-runtime.aar') }

android { testOptions { unitTests { includeAndroidResources = true; all { jvmArgs '--add-opens=java.base/java.io=ALL-UNNAMED' } } } }
dependencies {
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.robolectric:robolectric:4.14.1'
 testImplementation 'org.mockito:mockito-core:5.14.2'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
android { defaultConfig { testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }; testOptions { unitTests.all { systemProperty 'robolectric.dependency.repo.url','https://repo.maven.apache.org/maven2' } } }
