name: Publish client prerelease
on:
  push:
    tags: ['clients-*-beta.*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sha256sum -c SHA256SUMS
      - name: Publish verified installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease --title "Air2Mi 客户端测试版 · fnOS 0.1.14 / Android 1.1.2" --notes-file README.md Air2Mi.fpk Air2Mi-arm64.apk SHA256SUMS
