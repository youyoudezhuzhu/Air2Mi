name: Publish Engine updates
on:
  push:
    branches: [main]
    tags: ['publish-engine-*']
    paths: ['.github/workflows/publish-engine-pages.yml', 'tools/publish_engine_pages.py']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing public Engine binary tag to distribute
        required: true
        default: engine-0.3.11-beta.14-public-hardened
  release:
    types: [published]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: engine-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'release' || (!github.event.release.prerelease && startsWith(github.event.release.tag_name, 'engine-'))
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cryptography==46.0.3
      - if: github.event_name != 'release'
        id: engine
        env:
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          if [[ -n "$MANUAL_TAG" ]]; then
            tag="$MANUAL_TAG"
          elif [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag="${GITHUB_REF_NAME#publish-}"
          else
            tag=engine-0.3.11-beta.14-public-hardened
          fi
          git check-ref-format "refs/tags/$tag"
          [[ "$tag" == engine-* ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - if: github.event_name != 'release'
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.engine.outputs.tag }}
          path: assets
      - if: github.event_name == 'release'
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets -p '*.run' -p '*.manifest.json' -p '*-components.zip'
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@v5
      - run: python tools/publish_engine_pages.py
        env:
          UPDATE_KEY_B64: ${{ secrets.AIR2MI_UPDATE_KEY_B64 }}
          UPDATE_SEQUENCE: ${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
