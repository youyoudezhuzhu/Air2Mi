name: fnOS FPK
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  fnos-x64:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install frontend dependencies
        run: npm ci --prefix web --no-audit --no-fund
      - name: Type check, tests and production UI
        run: |
          mkdir -p reports
          npm --prefix web run check 2>&1 | tee reports/types.log
          npm --prefix web test 2>&1 | tee reports/web-tests.log
          npm --prefix web run build 2>&1 | tee reports/web-build.log
      - name: Host tests
        run: go test -race -v ./hosts/fnos 2>&1 | tee reports/host-tests.log
      - name: Download pinned official fnpack
        run: python3 tools/download_fnpack.py
      - name: Build actual FPK
        run: python3 tools/build_fpk.py --fnpack "$PWD/build/fnpack" 2>&1 | tee reports/fpk-build.log
      - name: Static FPK validation
        run: python3 tools/check_fpk.py dist/Air2Mi.fpk --expect-no-engine 2>&1 | tee reports/fpk-check.log
      - name: Actual public Host and responsive UI without Engine
        env:
          AIR2MI_BROWSER_TEST: '1'
        run: |
          npx --prefix web playwright install --with-deps chromium
          python3 tests/public_host.py 2>&1 | tee reports/public-host.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Air2Mi-fnos-x64-${{ github.sha }}
          path: |
            dist/
          if-no-files-found: error
